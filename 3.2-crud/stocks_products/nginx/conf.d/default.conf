# nginx/conf.d/default.conf

upstream django {
    # Имя сервиса из docker-compose и порт, который мы указали в EXPOSE/CMD
    server backend:8000;
}

server {
    listen 80;
    server_name localhost;

    # Обработка статики (файлы, собранные collectstatic)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Обработка медиа-файлов (загруженные пользователями)
    # location /media/ {
    #     alias /app/media/;
    # }

    # Проксирование всех остальных запросов на Django (Gunicorn)
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты на случай долгих запросов
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}